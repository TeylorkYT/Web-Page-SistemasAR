# ==============================================================================
# CONFIGURACIÓN DE NGINX PARA SISTEMASAR (Producción en VPS Ubuntu 22.04 LTS)
# Dominio: sistemasar.net / www.sistemasar.net
# ==============================================================================

# Zona de limitación de tasa para prevenir ataques de denegación de servicio (DoS)
limit_req_zone $binary_remote_addr zone=sistemasar_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=sistemasar_auth:10m rate=5r/s;

# Redirección obligatoria de HTTP (puerto 80) hacia HTTPS (puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name sistemasar.net www.sistemasar.net;

    # Renovación automática de certificados Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS (puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistemasar.net www.sistemasar.net;

    # Certificados SSL emitidos por Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/sistemasar.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemasar.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sistemasar.net/chain.pem;

    # Protocolos y cifrados seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de seguridad reforzadas (Hardening)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Límite de carga para archivos adjuntos de evidencia (RF-08: máx. 5 MB + margen)
    client_max_body_size 6M;

    # 1. Frontend React SPA (archivos estáticos compilados en /var/www/sistemasar/frontend/dist)
    root /var/www/sistemasar/frontend/dist;
    index index.html;

    # Caché optimizada para assets inmutables de Vite
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Enrutamiento de React Router: fallback a index.html para evitar 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend FastAPI (Reverse Proxy hacia Uvicorn en 127.0.0.1:8000)
    location /api/ {
        limit_req zone=sistemasar_api burst=25 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras de reenvío de cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de proxy
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Protección reforzada sobre endpoint de autenticación contra fuerza bruta
    location /api/v1/auth/ {
        limit_req zone=sistemasar_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ocultar o restringir rutas internas de desarrollo en producción
    location ~* ^/(db-check|docs|redoc|openapi.json) {
        # Permitir solo desde IP de administración interna si fuera necesario, o bloquear
        deny all;
        return 404;
    }

    # Páginas de error personalizadas
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
