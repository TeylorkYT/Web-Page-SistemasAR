name: CI - Integración Continua SistemasAR

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-sqlite:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas herméticas con SQLite
        env:
          ENV: test
          JWT_SECRET: ci-jwt-secret-testing-sistemas-ar-32-chars-min
        run: |
          pytest -q

  backend-mysql:
    name: Backend Tests (MySQL 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sistemas_ar_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cargar esquema de base de datos MySQL
        working-directory: .
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot < database/mibasededatos.sql
          sed 's/`sistemas_ar`/`sistemas_ar_test`/g; s/sistemas_ar;/sistemas_ar_test;/g' database/mibasededatos.sql | mysql -h 127.0.0.1 -P 3306 -u root -proot

      - name: Ejecutar pruebas contra MySQL 8.0
        env:
          ENV: test
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
          TEST_DB_NAME: sistemas_ar_test
          JWT_SECRET: ci-jwt-secret-testing-sistemas-ar-32-chars-min
        run: |
          pytest -q

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Validar linting
        run: npm run lint

      - name: Validar compilación de producción
        run: npm run build
